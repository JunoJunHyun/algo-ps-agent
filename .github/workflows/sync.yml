name: Sync PS Dashboard

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 15 * * *'

permissions:
  contents: write

jobs:
  update-readme:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update README Dashboard
        run: python scripts/update_dashboard.py
      - name: Commit & Push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "docs: 대시보드 및 복습 일정 자동 갱신 [skip ci]" && git push)
